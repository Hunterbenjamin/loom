<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>spike 03</title>
    <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1e1e1e;
        color: #ccc;
        font: 12px -apple-system, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #bar {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 4px 8px;
        border-bottom: 1px solid #333;
      }
      #grid {
        flex: 1;
        display: grid;
        gap: 4px;
        padding: 4px;
        min-height: 0;
      }
      .cell {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
        border: 1px solid #333;
      }
      .cell.focused {
        border-color: #4a8;
      }
      .cell header {
        display: flex;
        justify-content: space-between;
        padding: 2px 6px;
        background: #252525;
      }
      .term {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        position: relative;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <b id="renderer"></b>
      <span id="status"></span>
    </div>
    <div id="grid"></div>
    <script type="module" src="renderer.mjs"></script>
  </body>
</html>
