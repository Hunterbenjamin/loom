name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: actions/setup-node@v4
        with:
          node-version-file: '.npmrc'
          corepack-home: ${{ runner.temp }}/corepack

      - name: Enable corepack
        run: corepack enable

      - name: Get pnpm version
        id: pnpm-version
        run: echo "version=$(node -e "console.log(require('./package.json').packageManager.split('@')[1])")" >> $GITHUB_OUTPUT

      - name: Setup pnpm store cache
        uses: actions/setup-node@v4
        with:
          node-version-file: '.npmrc'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test
        env:
          # Real provider tests require authentication and should not run in CI
          LOOM_REAL_PROVIDERS: ''
